name: Build Server

on:
  push: 
    branches: [master, dev]
    paths:
      - 'src/backend/trading_server/**'
      - '.github/workflows/build_server.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create .env file for build
        run: touch .env
      
      - name: Build Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend/trading_server
          file: ./src/backend/trading_server/Dockerfile
          push: false
          load: true
          tags: alchemist-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Verify image
        run: |
          docker images | grep alchemist-server