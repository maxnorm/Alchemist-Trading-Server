name: Lint Server

on:
  push:
    branches: [master, dev]
    paths:
      - 'src/trading_server/**'
      - '.github/workflows/lint_server.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      
      - name: Install dependencies
        working-directory: src/trading_server
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy bandit safety
      
      - name: Run code formatting check (Black)
        run: |
          black --check src/trading_server/src || exit 1
      
      - name: Run linter (flake8)
        run: |
          flake8 src/trading_server/src --max-line-length=120 --extend-ignore=E203,W503 || exit 1
      
      - name: Run type checking (mypy)
        run: |
          mypy src/trading_server/src --ignore-missing-imports || exit 1