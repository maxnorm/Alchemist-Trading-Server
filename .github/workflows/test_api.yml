name: Test API

on:
  push:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: forex_user
          POSTGRES_PASSWORD: forex_password
          POSTGRES_DB: db_forex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U forex_user -d db_forex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/backend/api/requirements.txt'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Install dependencies
        working-directory: src/backend/api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      
      - name: Run API tests
        env:
          DATABASE_URL: postgresql+psycopg2://forex_user:forex_password@localhost:5432/db_forex
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: forex_user
          DB_PASSWORD: forex_password
          DB_NAME: db_forex
          PYTHONPATH: ${{ github.workspace }}/src/backend/api/src:${{ github.workspace }}
        run: |
          pytest tests/api/ --cov=src/backend/api/src --cov-report=xml --cov-report=term -v || exit 1
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: api
          name: api-coverage