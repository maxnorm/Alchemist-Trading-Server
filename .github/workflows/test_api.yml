name: Test API

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.9.5
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_forex
          MYSQL_USER: forex_user
          MYSQL_PASSWORD: forex_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev mariadb-client
      
      - name: Install dependencies
        working-directory: src/api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
      
      - name: Run API tests
        env:
          DATABASE_URL: mysql://forex_user:forex_password@localhost:3306/db_forex
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: forex_user
          DB_PASSWORD: forex_password
          DB_NAME: db_forex
        run: |
          pytest tests/api/ --cov=src/api/src --cov-report=xml --cov-report=term -v || exit 1
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: api
          name: api-coverage