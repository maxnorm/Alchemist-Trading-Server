name: Test Server

on:
  push:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: forex_user
          POSTGRES_PASSWORD: forex_password
          POSTGRES_DB: db_forex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U forex_user -d db_forex"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      
      - name: Install dependencies
        working-directory: src/backend/trading_server
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install test dependencies
        run: |
          pip install -r tests/requirements-test.txt
      
      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -U forex_user -d db_forex; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      
      - name: Run unit tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: forex_user
          DB_PASSWORD: forex_password
          DB_NAME: db_forex
        run: |
          pytest tests/trading_server/unit/ --cov=src/backend/trading_server/src --cov-report=xml --cov-report=term -v || exit 1
      
      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: forex_user
          DB_PASSWORD: forex_password
          DB_NAME: db_forex
        run: |
          pytest tests/trading_server/integration/ -v || exit 1
      
      - name: Run E2E tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: forex_user
          DB_PASSWORD: forex_password
          DB_NAME: db_forex
        run: |
          pytest tests/trading_server/e2e/ -v || exit 1
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: server
          name: server-coverage