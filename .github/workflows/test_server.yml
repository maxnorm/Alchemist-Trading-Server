name: Test Server

on:
  pull_request:
    branches: [master, dev]
    paths:
      - 'src/mt5-python_server/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'tests/e2e/**'
      - 'tests/performance/**'
      - 'tests/stress/**'
      - 'tests/__init__.py'
      - 'pytest.ini'
      - '.github/workflows/test_server.yml'
  push:
    branches: [master, dev]
    paths:
      - 'src/mt5-python_server/**'
      - 'tests/unit/**'
      - 'tests/integration/**'
      - 'tests/e2e/**'
      - 'tests/performance/**'
      - 'tests/stress/**'
      - 'tests/__init__.py'
      - 'pytest.ini'
      - '.github/workflows/test_server.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.9.5
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_forex
          MYSQL_USER: forex_user
          MYSQL_PASSWORD: forex_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: src/mt5-python_server
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
      
      - name: Wait for MariaDB to be ready
        run: |
          until mysqladmin ping -h localhost -u root -proot --silent; do
            echo "Waiting for MariaDB..."
            sleep 2
          done
          echo "MariaDB is ready!"
      
      - name: Run unit tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: forex_user
          DB_PASSWORD: forex_password
          DB_NAME: db_forex
        run: |
          pytest tests/unit/ --cov=src/mt5-python_server/src --cov-report=xml --cov-report=term -v || exit 1
      
      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: forex_user
          DB_PASSWORD: forex_password
          DB_NAME: db_forex
        run: |
          pytest tests/integration/ -v || exit 1
      
      - name: Run E2E tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: forex_user
          DB_PASSWORD: forex_password
          DB_NAME: db_forex
        run: |
          pytest tests/e2e/ -v || exit 1
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          flags: server
          name: server-coverage