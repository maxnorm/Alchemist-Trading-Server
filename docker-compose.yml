services:
    # ============================================
    # Gateway (Main Entry Point)
    # ============================================
    gateway:
        container_name: "gateway"
        image: nginx:alpine
        ports:
            - "80:80"
            - "443:443"  # For future HTTPS
            - "5557:5557"  # ZeroMQ broker PULL (EAs connect here)
            - "5556:5556"  # ZeroMQ order port (trading operations)
        volumes:
            - "./src/backend/gateway/nginx.conf:/etc/nginx/nginx.conf:ro"
            - "./src/backend/gateway/conf.d:/etc/nginx/conf.d:ro"
            - "./logs/gateway:/var/log/nginx"  # Bind mount to sync logs to codebase
        depends_on:
            api:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/gateway/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    # ============================================
    # Database (Internal Only)
    # ============================================
    postgres:
        container_name: "postgres"
        image: timescale/timescaledb:latest-pg16
        ports:
            - "5432:5432" # For local access - REMOVE THIS LINE FOR PRODUCTION
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
            SEED_HISTORICAL_DATA: ${SEED_HISTORICAL_DATA:-false}
        volumes:
            - "./src/backend/database/scripts:/docker-entrypoint-initdb.d"
            - "./src/backend/database/postgresql.conf:/etc/postgresql/postgresql.conf:ro"
            - "postgres_data:/var/lib/postgresql/data"
            # Mount Parquet data directory for seeding (read-only)
            # - "./data/dukascopy:/data/dukascopy:ro"  # Uncomment when ready to seed
        command: postgres -c config_file=/etc/postgresql/postgresql.conf
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # ============================================
    # Trading Server (Internal Only)
    # ============================================
    server:
        container_name: "server"
        build:
            context: ./src/backend/trading_server
            dockerfile: Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            LOG_DIR: /app/logs
            STREAMER_AUTH_TOKEN: ${STREAMER_AUTH_TOKEN}
            SERVER_IP: ${SERVER_IP}
            SERVER_PORT: ${SERVER_PORT}
            MYFXBOOK_EMAIL: ${MYFXBOOK_EMAIL:-}
            MYFXBOOK_PASSWORD: ${MYFXBOOK_PASSWORD:-}
            URL_MYFXBOOK: ${URL_MYFXBOOK:-}
            FRED_API_KEY: ${FRED_API_KEY:-}
            NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_DB: 0
            # ZeroMQ Configuration
            ZMQ_HOST: ${ZMQ_HOST:-127.0.0.1}
            ZMQ_ORDER_PORT: ${ZMQ_ORDER_PORT:-5556}
            ZMQ_TICK_PORT: ${ZMQ_TICK_PORT:-5555}
        volumes:
            - "./logs:/app/logs"
            - "./models:/app/models"
        restart: unless-stopped

    # Backup service - run manually with: docker compose run --rm backup
    # Or schedule with external cron: 0 2 * * * cd /path/to/project && docker compose run --rm backup
    backup:
        container_name: "db_backup"
        image: postgres:16
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PGHOST: ${DB_HOST}
            PGPORT: ${DB_PORT}
            PGUSER: ${DB_USER}
            PGPASSWORD: ${DB_PASSWORD}
            PGDATABASE: ${DB_NAME}
            DB_BACKUP_DIR: /backups
            DB_BACKUP_RETENTION_DAYS: 7
        volumes:
            - "./src/backend/database/backup.py:/app/backup.py:ro"
            - "backup_data:/backups"
        command: >
            sh -c "
            apt-get update -qq && 
            apt-get install -y -qq python3 python3-pip && 
            pip3 install -q psycopg2-binary && 
            python3 /app/backup.py
            "
        profiles:
            - backup

    # ============================================
    # MLflow (Internal Only)
    # ============================================
    mlflow:
        container_name: "mlflow"
        image: ghcr.io/mlflow/mlflow:v2.10.0
        environment:
            MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow/mlflow.db
            MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
        volumes:
            - "mlflow_data:/mlflow"
        command: >
            mlflow server
            --host ${MLFLOW_HOST:-0.0.0.0}
            --port ${MLFLOW_PORT:-5000}
            --backend-store-uri sqlite:///mlflow/mlflow.db
            --default-artifact-root /mlflow/artifacts
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${MLFLOW_PORT:-5000}/health').read()\" || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        restart: unless-stopped

    # ============================================
    # FastAPI REST API and WebSocket Service
    # ============================================
    api:
        container_name: "api"
        build:
            context: ./src/backend/api
            dockerfile: Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
            mlflow:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            API_HOST: ${API_HOST}
            API_PORT: ${API_PORT}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            MLFLOW_TRACKING_URI: ${MLFLOW_URI:-http://mlflow:5000}
            LOG_LEVEL: ${LOG_LEVEL}
            KILL_SWITCH_FILE: ${KILL_SWITCH_FILE:-/app/logs/kill_switch.flag}
            CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
            CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
            CLERK_SEED_ENABLED: ${CLERK_SEED_ENABLED:-false}
            CLERK_SEED_EMAIL: ${CLERK_SEED_EMAIL}
            CLERK_SEED_PASSWORD: ${CLERK_SEED_PASSWORD}
            CLERK_SEED_ROLES: ${CLERK_SEED_ROLES}
            MT5_SERVER_PUBLIC_HOST: ${MT5_SERVER_PUBLIC_HOST:-}
            MT5_SERVER_PUBLIC_PORT: ${MT5_SERVER_PUBLIC_PORT:-}
            TRADING_SERVER_HOST: ${SERVER_IP:-server}
            TRADING_SERVER_PORT: ${SERVER_PORT:-8080}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_DB: 0
        volumes:
            - "./logs:/app/logs"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://127.0.0.1:${API_PORT}/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    # ============================================
    # Prometheus (Internal Only)
    # ============================================
    prometheus:
        container_name: "prometheus"
        image: prom/prometheus:latest
        environment:
            API_PORT: ${API_PORT}
            SERVER_PORT: ${SERVER_PORT}
            PROMETHEUS_PORT: ${PROMETHEUS_PORT}
        volumes:
            - "./src/backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro"
            - "./src/backend/monitoring/prometheus/entrypoint.sh:/entrypoint.sh:ro"
            - "./src/backend/monitoring/prometheus/alerts:/etc/prometheus/alerts:ro"
            - "prometheus_data:/prometheus"
        entrypoint: ["/bin/sh", "/entrypoint.sh"]
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
        depends_on:
            - api
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:${PROMETHEUS_PORT:-9090}/-/healthy"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # ============================================
    # Grafana (Internal Only)
    # ============================================
    grafana:
        container_name: "grafana"
        image: grafana/grafana:latest
        environment:
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
            - GF_INSTALL_PLUGINS=
            - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
        volumes:
            - "grafana_data:/var/lib/grafana"
            - "./src/backend/monitoring/grafana/provisioning:/etc/grafana/provisioning"
            - "./src/backend/monitoring/grafana/dashboards:/var/lib/grafana/dashboards"
        depends_on:
            - prometheus
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # ============================================
    # Redis (Celery Broker & Message Queue)
    # ============================================
    redis:
        container_name: "redis"
        image: redis:7-alpine
        volumes:
            - "redis_data:/data"
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    # ============================================
    # Airflow Services
    # ============================================
    airflow-init:
        container_name: "airflow-init"
        image: apache/airflow:2.8.0
        environment:
            - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
            - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
            - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
            - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
            - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-8tuvdCw3D24CUX1GYC51g1g-bpEkB-S3K3p9zF-P0KE=}
            - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
        volumes:
            - "./src/backend/trading_server/src/infrastructure/data_pipeline/airflow/dags:/opt/airflow/dags"
            - "./airflow_logs:/opt/airflow/logs"
            - "./airflow_plugins:/opt/airflow/plugins"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: >
            bash -c "
            airflow db init &&
            airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true
            "
        restart: "no"
        profiles:
            - init

    airflow-webserver:
        container_name: "airflow-webserver"
        image: apache/airflow:2.8.0
        ports:
            - "8081:8080"
        environment:
            - AIRFLOW__CORE__EXECUTOR=CeleryExecutor    
            - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
            - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
            - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
            - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-8tuvdCw3D24CUX1GYC51g1g-bpEkB-S3K3p9zF-P0KE=}
            - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
            - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
            - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
        volumes:
            - "./src/backend/trading_server/src/infrastructure/data_pipeline/airflow/dags:/opt/airflow/dags"
            - "./airflow_logs:/opt/airflow/logs"
            - "./airflow_plugins:/opt/airflow/plugins"
            - "./src/backend/trading_server/src/infrastructure/data_pipeline/airflow/scripts/airflow-webserver-entrypoint.sh:/entrypoint.sh:ro"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        entrypoint:
            - /bin/bash
            - -c
            - |
              sed 's/\r$//' /entrypoint.sh | bash
        command: []
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        restart: unless-stopped

    airflow-scheduler:
        container_name: "airflow-scheduler"
        image: apache/airflow:2.8.0
        environment:
            - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
            - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
            - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
            - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
            - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-8tuvdCw3D24CUX1GYC51g1g-bpEkB-S3K3p9zF-P0KE=}
            - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
        volumes:
            - "./src/backend/trading_server/src/infrastructure/data_pipeline/airflow/dags:/opt/airflow/dags"
            - "./airflow_logs:/opt/airflow/logs"
            - "./airflow_plugins:/opt/airflow/plugins"
            - "./src/backend/trading_server/src/infrastructure/data_pipeline/airflow/scripts/airflow-scheduler-entrypoint.sh:/entrypoint.sh:ro"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            airflow-webserver:
                condition: service_healthy
        entrypoint:
            - /bin/bash
            - -c
            - |
              sed 's/\r$//' /entrypoint.sh | bash
        command: []
        restart: unless-stopped

    airflow-worker:
        container_name: "airflow-worker"
        image: apache/airflow:2.8.0
        environment:
            - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
            - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
            - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
            - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
            - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-8tuvdCw3D24CUX1GYC51g1g-bpEkB-S3K3p9zF-P0KE=}
            - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
            - AIRFLOW__CORE__LOAD_EXAMPLES=False
        volumes:
            - "./src/backend/trading_server/src/infrastructure/data_pipeline/airflow/dags:/opt/airflow/dags"
            - "./airflow_logs:/opt/airflow/logs"
            - "./airflow_plugins:/opt/airflow/plugins"
            - "./src/backend/trading_server/src/infrastructure/data_pipeline/airflow/scripts/airflow-worker-entrypoint.sh:/entrypoint.sh:ro"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            airflow-webserver:
                condition: service_healthy
        entrypoint:
            - /bin/bash
            - -c
            - |
              sed 's/\r$//' /entrypoint.sh | bash
        command: []
        restart: unless-stopped

volumes:
    postgres_data:
    backup_data:
    mlflow_data:
    prometheus_data:
    grafana_data:
    redis_data: