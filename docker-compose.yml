services:
    # ============================================
    # Gateway (Main Entry Point)
    # ============================================
    gateway:
        container_name: "gateway"
        image: nginx:alpine
        ports:
            - "80:80"
            - "443:443"  # For future HTTPS
        volumes:
            - "./src/gateway/nginx.conf:/etc/nginx/nginx.conf:ro"
            - "./src/gateway/conf.d:/etc/nginx/conf.d:ro"
            - "gateway_logs:/var/log/nginx"
        depends_on:
            - dashboard
            - api
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/gateway/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    # ============================================
    # Database (Internal Only)
    # ============================================
    postgres:
        container_name: "postgres"
        image: timescale/timescaledb:latest-pg16
        # REMOVED: ports - no external access
        environment:
            POSTGRES_USER: forex_user
            POSTGRES_PASSWORD: forex_password
            POSTGRES_DB: db_forex
        volumes:
            - "./src/database/scripts:/docker-entrypoint-initdb.d"
            - "./src/database/postgresql.conf:/etc/postgresql/postgresql.conf:ro"
            - "postgres_data:/var/lib/postgresql/data"
        command: postgres -c config_file=/etc/postgresql/postgresql.conf
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U forex_user -d db_forex"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # ============================================
    # Trading Server (Internal Only)
    # ============================================
    server:
        container_name: "server"
        build:
            context: .
            dockerfile: Dockerfile
        # REMOVED: ports - no external access
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: forex_user
            DB_PASSWORD: forex_password
            DB_NAME: db_forex
            LOG_DIR: /app/logs
        volumes:
            - "./logs:/app/logs"
            - "./models:/app/models"
        restart: unless-stopped

    # Backup service - run manually with: docker compose run --rm backup
    # Or schedule with external cron: 0 2 * * * cd /path/to/project && docker compose run --rm backup
    backup:
        container_name: "db_backup"
        image: postgres:16
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PGHOST: postgres
            PGPORT: 5432
            PGUSER: forex_user
            PGPASSWORD: forex_password
            PGDATABASE: db_forex
            DB_BACKUP_DIR: /backups
            DB_BACKUP_RETENTION_DAYS: 7
        volumes:
            - "./src/database/backup.py:/app/backup.py:ro"
            - "backup_data:/backups"
        command: >
            sh -c "
            apt-get update -qq && 
            apt-get install -y -qq python3 python3-pip && 
            pip3 install -q psycopg2-binary && 
            python3 /app/backup.py
            "
        profiles:
            - backup

    # ============================================
    # MLflow (Internal Only - Optional to expose via gateway)
    # ============================================
    mlflow:
        container_name: "mlflow"
        image: ghcr.io/mlflow/mlflow:v2.10.0
        # REMOVED: ports - access via gateway if needed
        environment:
            MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow/mlflow.db
            MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
        volumes:
            - "mlflow_data:/mlflow"
        command: >
            mlflow server
            --host 0.0.0.0
            --port 5000
            --backend-store-uri sqlite:///mlflow/mlflow.db
            --default-artifact-root /mlflow/artifacts
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000').read()"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        restart: unless-stopped

    # ============================================
    # FastAPI REST API and WebSocket Service
    # ============================================
    api:
        container_name: "api"
        build:
            context: ./src/api
            dockerfile: Dockerfile
        # REMOVED: ports - access via gateway
        depends_on:
            postgres:
                condition: service_healthy
            mlflow:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql+psycopg2://forex_user:forex_password@postgres:5432/db_forex
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: forex_user
            DB_PASSWORD: forex_password
            DB_NAME: db_forex
            MLFLOW_TRACKING_URI: http://mlflow:5000
            API_HOST: 0.0.0.0
            API_PORT: 8000
            LOG_LEVEL: INFO
            KILL_SWITCH_FILE: /app/logs/kill_switch.flag
        volumes:
            - "./logs:/app/logs"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    # ============================================
    # React Dashboard
    # ============================================
    dashboard:
        container_name: "dashboard"
        build:
            context: ./src/dashboard
            dockerfile: Dockerfile
        # REMOVED: ports - access via gateway
        # UPDATED: Environment variables to use gateway paths
        environment:
            VITE_API_URL: /api/v1
            VITE_WS_URL: /ws
        depends_on:
            api:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # ============================================
    # Prometheus (Internal Only)
    # ============================================
    prometheus:
        container_name: "prometheus"
        image: prom/prometheus:latest
        # REMOVED: ports - internal only
        volumes:
            - "./src/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
            - "./src/monitoring/prometheus/alerts:/etc/prometheus/alerts:ro"
            - "prometheus_data:/prometheus"
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
        depends_on:
            - api
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # ============================================
    # Grafana (Internal Only - Optional to expose via gateway)
    # ============================================
    grafana:
        container_name: "grafana"
        image: grafana/grafana:latest
        # REMOVED: ports - access via gateway if needed
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_INSTALL_PLUGINS=
            # Configure Grafana to work behind reverse proxy
            - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
        volumes:
            - "grafana_data:/var/lib/grafana"
            - "./src/monitoring/grafana/provisioning:/etc/grafana/provisioning"
            - "./src/monitoring/grafana/dashboards:/var/lib/grafana/dashboards"
        depends_on:
            - prometheus
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    postgres_data:
    backup_data:
    mlflow_data:
    prometheus_data:
    grafana_data:
    gateway_logs: