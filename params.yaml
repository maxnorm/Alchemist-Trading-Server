# DVC Pipeline Parameters
# These values are tracked by DVC for reproducibility

# Data split ratios
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Feature processing parameters
features:
  window_size: 50
  normalize: true
  add_technical_indicators: true
  indicators:
    - rsi
    - macd
    - bollinger_bands
    - atr
    - ema_12
    - ema_26

# Data export parameters
export:
  ticks_days: 90
  calendar_days: 180
  symbols:
    - EURUSD
    - GBPUSD
    - USDJPY
