# DVC Pipeline Parameters
# These values are tracked by DVC for reproducibility

# Dukascopy historical data collection
dukascopy:
  pairs:
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
    - NZDUSD
    - USDCHF
    - USDCAD
    - EURGBP
    - EURJPY
    - EURAUD
    - EURNZD
    - EURCHF
    - EURCAD
    - GBPJPY
    - GBPAUD
    - GBPNZD
    - GBPCHF
    - GBPCAD
    - AUDJPY
    - NZDJPY
    - CHFJPY
    - CADJPY
    - AUDNZD
    - AUDCHF
    - AUDCAD
    - NZDCHF
    - NZDCAD
    - CADCHF
  start_date: "2003-01-01"
  end_date: "2024-12-31"
  rate_limit:
    batch_size: 3
    pause_ms: 5000

# Data split ratios
split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Feature processing parameters
features:
  window_size: 50
  normalize: true
  add_technical_indicators: true
  indicators:
    - rsi
    - macd
    - bollinger_bands
    - atr
    - ema_12
    - ema_26

# Data export parameters
export:
  ticks_days: 90
  calendar_days: 180
  symbols:
    - EURUSD
    - GBPUSD
    - USDJPY
