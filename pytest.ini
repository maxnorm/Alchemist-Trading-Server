[pytest]
# Pytest configuration for the test suite

# Asyncio configuration - set default fixture loop scope to function
asyncio_default_fixture_loop_scope = function

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    stress: Stress tests
    performance: Performance tests
    slow: Slow running tests

# Timeout for tests (in seconds) - prevents hanging
# Note: Requires pytest-timeout plugin. Install with: pip install pytest-timeout
# timeout = 300

# Coverage options (if pytest-cov is installed)
[coverage:run]
source = src/backend/api/src,src/backend/trading_server/src
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
