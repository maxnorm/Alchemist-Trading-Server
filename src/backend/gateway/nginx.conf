worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Hide nginx version for security
    server_tokens off;

    # Performance optimizations
    send_timeout 30;
    sendfile on;
    tcp_nopush on;

    # DNS resolver for dynamic upstream resolution
    # Uses Docker's internal DNS (127.0.0.11) with caching
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=50r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/m;

    # Upstream definitions
    upstream api {
        server api:8000;
    }

    # Optional: Uncomment if you want to expose MLflow
    # upstream mlflow {
    #     server mlflow:5000;
    # }

    # Optional: Uncomment if you want to expose Grafana
    # upstream grafana {
    #     server grafana:3000;
    # }

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}

# Stream module for TCP/UDP proxying (MT5 EA connections)
stream {
    # Log format for stream connections
    log_format stream_format '$remote_addr [$time_local] '
                             '$protocol $status $bytes_sent $bytes_received '
                             '$session_time $upstream_addr';
    
    # Connection limiting zone fo TCP connections
    # 10m shared memory zone can track ~160,000 IP addresses
    limit_conn_zone $binary_remote_addr zone=mt5_conn_limit:10m;
    
    # Upstream definitions for ZeroMQ ports
    upstream zmq_broker_pull {
        server server:5557 max_fails=3 fail_timeout=30s;
    }
    
    # zmq_broker_pub removed - subscribers connect directly to server:5555 (internal only)
    
    upstream zmq_order_port {
        server server:5556 max_fails=3 fail_timeout=30s;
    }
    
    # Legacy upstream (for backward compatibility)
    upstream mt5_backend {
        server server:8080 max_fails=3 fail_timeout=30s;
    }
    
    # Include stream server configurations
    include /etc/nginx/conf.d/stream/*.conf;
}