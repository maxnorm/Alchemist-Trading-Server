# MT5 EA Connection Gateway
# Handles raw TCP connections from MT5 Expert Advisors

server {
    listen 8080;
    # Note: server_name is for documentation/TLS SNI only
    # For plain TCP, routing is based on port only
    # The subdomain (mt5.yourdomain.com) is handled at DNS level
    
    # Connection limits
    # Allow sufficient connections for multiple tick streamers (28+ major pairs + exotic pairs)
    # Plus trading operation EAs (typically 1 per account, but can be more)
    # Note: limit_req is HTTP-only, not available in stream module
    # Connection limiting is handled at the connection level, not request level
    limit_conn mt5_conn_limit 100;  # Max 100 concurrent per IP (supports 28+ pairs + trading EAs)
    
    # Proxy to trading server
    proxy_pass mt5_backend;
    proxy_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_socket_keepalive on;
    
    # Logging
    # Logs will be synced to ./logs/gateway/ via Docker volume mount
    access_log /var/log/nginx/mt5_access.log stream_format;
    error_log /var/log/nginx/mt5_error.log;
}
