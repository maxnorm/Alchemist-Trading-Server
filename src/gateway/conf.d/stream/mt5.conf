# ZeroMQ Broker PULL Port (EAs connect here)
# This is the main entry point for tick streamers
server {
    listen 5557;
    
    # Connection limits
    # Allow sufficient connections for multiple tick streamers (28+ major pairs + exotic pairs)
    # Plus trading operation EAs (typically 1 per account, but can be more)
    limit_conn mt5_conn_limit 100;  # Max 100 concurrent per IP
    
    # Proxy to ZeroMQ broker PULL socket
    proxy_pass zmq_broker_pull;
    proxy_timeout 300s;  # Long timeout for persistent connections
    proxy_connect_timeout 10s;
    proxy_socket_keepalive on;
    
    # Buffer settings for high-frequency tick streaming
    proxy_buffer_size 64k;
    
    # Logging
    access_log /var/log/nginx/zmq_broker_pull_access.log stream_format;
    error_log /var/log/nginx/zmq_broker_pull_error.log;
}

# ZeroMQ Broker PUB Port (Subscribers connect here)
# REMOVED: Not needed through gateway - Python subscribers connect directly to server:5555
# Internal container-to-container communication doesn't require gateway proxy

# ZeroMQ Order Port (Trading operations)
server {
    listen 5556;
    
    limit_conn mt5_conn_limit 10;  # Lower limit for trading EAs
    
    proxy_pass zmq_order_port;
    proxy_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_socket_keepalive on;
    
    access_log /var/log/nginx/zmq_order_access.log stream_format;
    error_log /var/log/nginx/zmq_order_error.log;
}
