worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Hide nginx version for security
    server_tokens off;

    # Performance optimizations
    send_timeout 30;
    sendfile on;
    tcp_nopush on;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=50r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/m;

    # Upstream definitions
    upstream dashboard {
        server dashboard:80;
    }

    upstream api {
        server api:8000;
    }

    # Optional: Uncomment if you want to expose MLflow
    # upstream mlflow {
    #     server mlflow:5000;
    # }

    # Optional: Uncomment if you want to expose Grafana
    # upstream grafana {
    #     server grafana:3000;
    # }

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
